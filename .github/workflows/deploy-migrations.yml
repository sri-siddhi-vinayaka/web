name: Deploy database migrations

# Pushes supabase/migrations/*.sql to the staging Supabase project whenever
# they change on develop, via the official Supabase CLI (`supabase db push`)
# rather than a hand-rolled psql script — one less thing this volunteer
# project has to maintain itself.
#
# The "staging" GitHub Environment (Settings -> Environments) holds
# SUPABASE_STAGING_DB_PASSWORD as a secret and SUPABASE_STAGING_PROJECT_REF
# as a variable, restricted to deploy only from the develop branch — an
# extra guarantee on top of this workflow's own `on: push: branches:
# [develop]`. SUPABASE_ACCESS_TOKEN also lives there but is unused by this
# workflow now (see the --db-url comment below) — left in place in case a
# future step needs the Management API.
#
# Only wired up for staging so far, matching the one Supabase project that
# currently exists. To extend this to production once that project exists:
# duplicate the "push" job below pointed at a new "production" Environment
# (with its own SUPABASE_PRODUCTION_DB_PASSWORD secret and
# SUPABASE_PRODUCTION_PROJECT_REF variable, deploy-restricted to main), gated
# on `github.ref == 'refs/heads/main'`.
on:
  push:
    branches: [develop]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # `supabase link` calls a broader Management API surface than this
      # workflow's deliberately narrow-scoped access token (or possibly the
      # project's plan) allows — it failed with "Your account does not have
      # the necessary privileges to access this endpoint" even though the
      # token has exactly what Migrations/db push itself needs. `--db-url`
      # sidesteps `link` (and the access token) entirely: it's a direct
      # Postgres connection using only the DB password, which is all
      # `db push` actually needs to apply migrations.
      #
      # The direct connection host (db.<ref>.supabase.co) is IPv6-first and
      # GitHub-hosted runners can't reach it — that attempt failed with
      # ECONNREFUSED on an IPv6 address. Routing through Supabase's pooler
      # instead (built for exactly this: CI runners, serverless, anything
      # without a predictable/IPv4 source) fixes that. Session mode (5432),
      # not transaction mode (6543) — Supabase recommends session mode
      # specifically for migrations and other one-off tools, since
      # transaction-mode pooling doesn't reliably support everything a
      # schema migration might need. Note the pooler's username is
      # `postgres.<ref>`, not just `postgres` — that's what lets one shared
      # pooler host route to the right project's database.
      #
      # us-east-1 is this staging project's region (Project Settings ->
      # General) — hardcoded rather than a variable since there's only one
      # Supabase project to point at right now; revisit if a differently-
      # regioned production project is added later.
      - name: Push migrations to staging
        run: |
          supabase db push --db-url "postgresql://postgres.${SUPABASE_PROJECT_REF}:${SUPABASE_DB_PASSWORD}@aws-0-us-east-1.pooler.supabase.com:5432/postgres"
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_STAGING_PROJECT_REF }}
